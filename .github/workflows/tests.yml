name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run_all:
    runs-on: ubuntu-latest
    strategy:
      # Report each interpreter instead of cancelling the other matrix legs.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The core tests stay stdlib-only. Excel coverage is exercised below.
      - name: Run the test suite
        run: python run_tests.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Windows needs tzdata for the US Eastern decision clock.
      - name: Install what a Windows user actually needs
        run: python -m pip install tzdata openpyxl
      - name: Run every suite
        run: python run_tests.py

  excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Excel writer
        run: python -m pip install openpyxl
      - name: Run the Excel export suite
        run: python tests/test_excel_report.py

  source_review:
    # A download for reviewing this PR, not a release or a passing-test claim.
    # git archive includes tracked source only: no .git, keys or runtime files.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the exact review source
        run: |
          mkdir -p review-artifacts
          git archive --format=zip --output=review-artifacts/MoneyPrinter-source.zip HEAD
          git rev-parse HEAD > review-artifacts/REVIEW_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-review-${{ github.sha }}
          path: review-artifacts/
          retention-days: 7
          if-no-files-found: error
